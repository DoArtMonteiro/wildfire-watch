name: Deploy to Cloudflare Workers

# The single production deploy path. Every push to main is tested, typechecked,
# linted, built and exercised end to end before anything reaches Cloudflare;
# pull requests run the same gate without deploying. Cloudflare's own Git
# integration (Workers Builds) is intentionally disconnected so production
# never deploys twice.
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

# Never run two production deploys at once; a newer push waits for the current one.
concurrency:
  group: ${{ github.event_name == 'push' && 'production-deploy' || format('verify-{0}', github.ref) }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

jobs:
  deploy:
    name: Verify, build and deploy
    # Pinned: ubuntu-latest moved to 26.04, which Playwright 1.56 cannot install Chromium on.
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build (OpenNext for Cloudflare)
        run: npm run build:cloudflare
        env:
          # CARTO basemaps key: public by design (every browser request to CARTO
          # carries it), but only the production build needs it; pull-request
          # builds stub CARTO in the end-to-end tests. GitHub prints non-secret
          # environment values in the log, so an Actions secret of the same name
          # is preferred over the repository variable when both exist.
          NEXT_PUBLIC_CARTO_API_KEY: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && (secrets.CARTO_API_KEY || vars.CARTO_API_KEY) || '' }}

      # The production build under `wrangler dev`, with a synthetic FIRMS
      # snapshot and every third-party host stubbed: no network data is used.
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests
        run: npm run test:e2e

      - name: Upload end-to-end artefacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

      - name: Deploy to Cloudflare Workers
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: npm run deploy:cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
